[project]
name = "cq-sprites"
version = "0.1.0"
description = "Extract Crusaders Quest sprites from Unity asset bundles"
requires-python = ">=3.12"
dependencies = [
    "pillow==13.0.0",
    "unitypy==1.25.4",
]

[project.scripts]
cq-sprites = "cq_sprites:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
