name: Build and publish pandora image

on:
  push:
    branches:
      - master
    paths:
      - services/bot/**
      - shared/**
      - package.json
      - yarn.lock
      - .github/workflows/pandora.yml

jobs:
  build-push-pandora:
    env:
      DOCKER_IMAGE_TAG: ghcr.io/cq-pandora/pandora
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Generate image tags
        id: tags
        run: |
          PACKAGE_VERSION=$(jq -r .version services/bot/package.json)
          echo "versions=$DOCKER_IMAGE_TAG:$PACKAGE_VERSION,$DOCKER_IMAGE_TAG:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/bot/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.versions }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
