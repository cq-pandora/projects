name: Update assets

# Parses the live game and opens a pull request against cq-pandora/assets
# when the generated data or sprites change. The pull request merges itself
# once the assets repo's "Validate data" check passes, and the merge triggers
# the assets repo's docker build and redeploy.
#
# Secrets:
#   CQ_CRYPTO_JSON  contents of services/parser/crypto.json (blowfish + lcabx keys)
#   ASSETS_TOKEN    fine-grained token for cq-pandora/assets with
#                   "Contents" and "Pull requests" read and write

on:
  schedule:
    # Thursdays 10:00 UTC
    - cron: '0 10 * * 4'
  workflow_dispatch:

concurrency:
  group: update-assets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout assets
        uses: actions/checkout@v4
        with:
          repository: cq-pandora/assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: assets

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Configure parser
        working-directory: services/parser
        env:
          CQ_CRYPTO_JSON: ${{ secrets.CQ_CRYPTO_JSON }}
        run: |
          printf '%s' "$CQ_CRYPTO_JSON" > crypto.json
          mkdir -p "$RUNNER_TEMP/cq/decrypted" "$RUNNER_TEMP/cq/cache"
          jq -n --arg tmp "$RUNNER_TEMP/cq" --arg assets "$GITHUB_WORKSPACE/assets" '{
            decrypt_output_dir: "\($tmp)/decrypted",
            game_cache_path: "\($tmp)/cache",
            sprites_output_dir: $assets,
            information_output_dir: "\($assets)/information"
          }' > paths.json

      - name: Parse game
        id: parse
        working-directory: services/parser
        run: |
          yarn start > "$RUNNER_TEMP/parser.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/parser.log"; exit 1; }
          grep -E 'Using game version|Wrote [0-9]+ sprites|sprites:(warn|error)' "$RUNNER_TEMP/parser.log" || true
          echo "version=$(jq -r '.version[0].data' "$RUNNER_TEMP/cq/decrypted/get_versions.json")" >> "$GITHUB_OUTPUT"

      - name: Upload parser log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-log
          path: ${{ runner.temp }}/parser.log
          retention-days: 7

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          path: assets
          token: ${{ secrets.ASSETS_TOKEN }}
          branch: update/game-data
          delete-branch: true
          commit-message: Update to game data ${{ steps.parse.outputs.version }}
          title: Update to game data ${{ steps.parse.outputs.version }}
          body: |
            Generated by the `Update assets` workflow in cq-pandora/projects
            (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo cq-pandora/assets --auto --squash
